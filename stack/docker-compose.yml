# The helper services as one compose stack "tools", one container each.
# Run from this folder: DISCORD_TOKEN=... docker compose -p tools up -d --build
# Replaces the containers of rollover/docker-compose.yml and bot/docker-compose.yml (see README.md).
name: tools
x-rollover: &rollover
  build: ../rollover
  image: reskate-rollover:local
  restart: unless-stopped
  network_mode: host
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

services:
  rollover:
    <<: *rollover
    container_name: reskate-rollover
    environment:
      DRY_RUN: "true"          # false lets it act
      # MODUPDATE_MIN_PLAYERS, MODUPDATE_WAIT, DISCORD_WEBHOOK, STEAM_TOKEN_1B ...: see rollover/README.md

  status:
    <<: *rollover
    container_name: reskate-status
    entrypoint: ["python3", "-I", "/app/status.py"]
    environment:
      STATUS_WEBHOOK: ""       # empty = only log the cards
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - status:/state

  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    image: reskate-bot:local
    container_name: reskate-bot
    restart: unless-stopped
    network_mode: host
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      BOT_GUILD: "1558637403869155488"
      BOT_STATUS_CHANNEL: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/reskate/shared:/shared
      - bot-state:/state

  # The leaderboard database itself is written by the game servers (SQLite in /shared);
  # this container keeps hourly backups of it.
  leaderboard-backup:
    image: python:3.13-alpine
    container_name: reskate-leaderboard-backup
    restart: unless-stopped
    command: ["python3", "-I", "/app/dbbackup.py"]
    volumes:
      - ./dbbackup.py:/app/dbbackup.py:ro
      - /root/reskate/shared:/shared:ro
      - /root/reskate/backup:/backup

volumes:
  status:
    external: true
    name: reskate-status     # the existing volume, so the Discord card message is kept
  bot-state:
