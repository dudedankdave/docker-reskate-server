# Runs next to the ReSkate servers and needs the Docker socket to start and stop them.
# Starts in dry run (it only logs what it would do); DRY_RUN=false lets it act.
services:
  rollover:
    build: .
    image: reskate-rollover:local
    container_name: reskate-rollover
    restart: unless-stopped
    network_mode: host        # needs no Docker network of its own (cocojambo has none left)
    environment:
      DRY_RUN: "true"
      # MODUPDATE_MIN_PLAYERS: "3"   # map updates: below this many players, wait for the server to empty
      # MODUPDATE_WAIT: "60"         # ...for at most this many minutes, then start a copy anyway
      # DISCORD_WEBHOOK: https://discord.com/api/webhooks/...   # where it says what it does
      # STEAM_TOKEN_1B: ...   # only for a slot with no container yet to take the token from
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./servers.json:/config/servers.json:ro

  # Live status cards in Discord (status.py): one message, edited every minute.
  status:
    build: .
    image: reskate-rollover:local
    container_name: reskate-status
    entrypoint: ["python3", "-I", "/app/status.py"]
    restart: unless-stopped
    network_mode: host
    environment:
      STATUS_WEBHOOK: ""      # https://discord.com/api/webhooks/...; empty = only log the cards
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - status:/state         # remembers which message to edit
      # - ./servers.json:/config/servers.json:ro

volumes:
  status:
