# Builds and pushes dudedankdave/reskate-server for each new ReSkate release.
# Every 30 min it reads the latest release's launcher.json; if Docker Hub has no <ver> or no
# <ver>-slim tag for that version yet, it downloads the Linux server (checked against its SHA-256),
# builds the missing image(s) from main and pushes <ver>, <major>.<minor>, latest and/or
# <ver>-slim, slim. Each image is checked on its own, so a slim push that failed is retried too.
# Pull requests build the default image without pushing.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token).
# Optional secret DISCORD_WEBHOOK_UPDATES_ADMIN: a Discord webhook told when a run fails (once, not
# every 30 min) and when it runs through again. New releases and images are announced by the
# servers themselves (webhook scopes updates and updates-admin).
name: Release image

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build and push even if Docker Hub already has this version"
        type: boolean
        default: false
      push:
        description: "Push to Docker Hub (off = test build only)"
        type: boolean
        default: true
  pull_request:

permissions:
  contents: read
  actions: read    # the failure notice looks at the run before

concurrency:
  group: release-image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: dudedankdave/reskate-server
  UPSTREAM: Dingo-Shenanigans/ReSkate

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the latest ReSkate release
        id: release
        run: |
          set -euo pipefail
          curl -fsSL -m 30 "https://github.com/$UPSTREAM/releases/latest/download/launcher.json" -o launcher.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          info = json.load(open("launcher.json", encoding="utf-8-sig"))["server_linux"]
          v = info["version"]
          assert re.fullmatch(r"\d+(\.\d+)+", v), v
          url = info["url"]
          if url.startswith("asset:"):
              url = f"https://github.com/{os.environ['UPSTREAM']}/releases/download/v{v}/{url[6:]}"
          assert url.startswith("https://"), url
          print(f"version={v}")
          print(f"minor={'.'.join(v.split('.')[:2])}")
          print(f"url={url}")
          print(f"sha256={info['sha256'].lower()}")
          print(f"exe_sha256={info.get('exe_sha256', '').lower()}")
          PY
          rm launcher.json

      - name: Already on Docker Hub?
        id: hub
        run: |
          set -euo pipefail
          v=${{ steps.release.outputs.version }}
          case "${{ github.event_name }}" in
            pull_request) echo "push=false" >> "$GITHUB_OUTPUT" ;;
            workflow_dispatch) echo "push=${{ inputs.push }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "push=true" >> "$GITHUB_OUTPUT" ;;
          esac
          # "true" if the tag is missing; any answer but 200 or 404 stops the run (no re-push of a tag
          # that may well be there)
          missing() {
            local code
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/$IMAGE/tags/$1") || code=000
            case "$code" in
              200) echo "$IMAGE:$1 is on Docker Hub" >&2; echo false ;;
              404) echo "$IMAGE:$1 is not on Docker Hub yet, building it" >&2; echo true ;;
              *) echo "::error::Docker Hub answered $code for $IMAGE:$1" >&2; return 1 ;;
            esac
          }
          if [ "${{ github.event_name }}" = pull_request ] || [ "${{ inputs.force }}" = true ]; then
            default=true slim=true
          else
            default=$(missing "$v")
            slim=$(missing "$v-slim")
          fi
          echo "default=$default" >> "$GITHUB_OUTPUT"
          echo "slim=$slim" >> "$GITHUB_OUTPUT"
          if [ "$default" = true ] || [ "$slim" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the server
        if: steps.hub.outputs.build == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -m 600 "${{ steps.release.outputs.url }}" -o server.tar.gz
          echo "${{ steps.release.outputs.sha256 }}  server.tar.gz" | sha256sum -c -
          mkdir unpacked Server
          tar -xzf server.tar.gz -C unpacked --no-same-owner
          top=$(find unpacked -mindepth 1 -maxdepth 1 -type d)
          for f in ReSkateServer libsteam_api.so libtier0_s.so libvstdlib_s.so steamclient.so; do
            cp "$top/$f" Server/
          done
          exe=${{ steps.release.outputs.exe_sha256 }}
          if [ -n "$exe" ]; then echo "$exe  Server/ReSkateServer" | sha256sum -c -; fi
          rm -rf unpacked server.tar.gz

      - uses: docker/setup-buildx-action@v3
        if: steps.hub.outputs.build == 'true'

      - name: Log in to Docker Hub
        if: steps.hub.outputs.build == 'true' && steps.hub.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push) the default image
        if: steps.hub.outputs.default == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VERSION=${{ steps.release.outputs.version }}
          push: ${{ steps.hub.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.release.outputs.minor }}
            ${{ env.IMAGE }}:latest

      - name: Build (and push) the slim image
        if: steps.hub.outputs.slim == 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: slim/Dockerfile
          build-args: VERSION=${{ steps.release.outputs.version }}
          push: ${{ steps.hub.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.version }}-slim
            ${{ env.IMAGE }}:slim

      - name: Docker Hub README
        continue-on-error: true
        if: steps.hub.outputs.build == 'true' && steps.hub.outputs.push == 'true'
        run: |
          python3 hub-readme.py > hub-readme.md
          token=$(curl -fsS -X POST https://hub.docker.com/v2/users/login -H 'Content-Type: application/json' \
            -d "$(python3 -c 'import json,os;print(json.dumps({"username":os.environ["U"],"password":os.environ["P"]}))')" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          python3 -c 'import json;print(json.dumps({"full_description":open("hub-readme.md",encoding="utf-8").read()}))' \
            | curl -fsS -X PATCH "https://hub.docker.com/v2/repositories/$IMAGE/" -H "Authorization: JWT $token" \
                   -H 'Content-Type: application/json' --data @- >/dev/null
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          P: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tell Discord when the workflow fails or runs through again
        if: always() && github.event_name != 'pull_request'
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_UPDATES_ADMIN }}
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          VERSION: ${{ steps.release.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$HOOK" ] || { echo "DISCORD_WEBHOOK_UPDATES_ADMIN is not set"; exit 0; }
          # only a change is posted: ok -> failed, or failed -> ok, against the run before this one
          before=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=$GITHUB_REF_NAME&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.event != \"pull_request\" and .id != $GITHUB_RUN_ID)][0].conclusion // \"\"") \
            || { echo "::warning::cannot read the run before"; before=""; }
          if [ "$STATUS" = failure ] && [ "$before" != failure ]; then
            if [ -n "$VERSION" ]; then
              text="**IMAGE BUILD FAILED**: \`$IMAGE:$VERSION\` could not be built or pushed. The workflow tries again every 30 min."
            else
              text="**IMAGE BUILD FAILED**: the release workflow could not read the latest ReSkate release. It tries again every 30 min."
            fi
          elif [ "$STATUS" = success ] && [ "$before" = failure ]; then
            text="**IMAGE BUILD OK** again: the release workflow ran through (ReSkate ${VERSION})."
          else
            exit 0
          fi
          python3 -c 'import json, sys; print(json.dumps({"username": "ReSkate image build", "content": sys.argv[1] + "\n" + sys.argv[2], "allowed_mentions": {"parse": []}}))' "$text" "$RUN_URL" \
            | curl -fsS -m 20 -H 'Content-Type: application/json' --data @- "$HOOK" >/dev/null \
            || echo "::warning::Discord did not take the message"
